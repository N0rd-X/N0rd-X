<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.9" fill="#00D9FF" opacity="0.09"/>
    </pattern>
    <radialGradient id="bg" cx="36%" cy="50%" r="62%">
      <stop offset="0%" stop-color="#0F1338"/>
      <stop offset="100%" stop-color="#08091F"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" fill="#08091F"/>
  <rect width="1200" height="280" fill="url(#bg)" opacity="0.9"/>
  <rect width="1200" height="280" fill="url(#dots)"/>

  <!-- Left vertical rail -->
  <line x1="64" y1="44" x2="64" y2="246" stroke="#00D9FF" stroke-width="1.5" opacity="0.4"/>

  <!-- Anchor dots -->
  <circle cx="64" cy="44"  r="3" fill="#00D9FF" filter="url(#glow)" opacity="0.8"/>
  <circle cx="64" cy="145" r="6" fill="#00D9FF" filter="url(#glow)"/>
  <circle cx="64" cy="246" r="3" fill="#00D9FF" filter="url(#glow)" opacity="0.8"/>

  <!-- Top horizontal from left dot — partial -->
  <line x1="64" y1="44" x2="560" y2="44" stroke="#00D9FF" stroke-width="0.8" opacity="0.16"/>
  <!-- Top right corner bracket -->
  <line x1="1100" y1="44"  x2="1140" y2="44"  stroke="#00D9FF" stroke-width="0.8" opacity="0.16"/>
  <line x1="1140" y1="44"  x2="1140" y2="96"  stroke="#00D9FF" stroke-width="0.8" opacity="0.16"/>

  <!-- Bottom full-width line -->
  <line x1="64" y1="246" x2="1140" y2="246" stroke="#00D9FF" stroke-width="0.8" opacity="0.14"/>

  <!-- Right side ticks (decreasing) -->
  <line x1="1076" y1="118" x2="1140" y2="118" stroke="#00D9FF" stroke-width="0.6" opacity="0.10"/>
  <line x1="1100" y1="145" x2="1140" y2="145" stroke="#00D9FF" stroke-width="0.6" opacity="0.07"/>
  <line x1="1116" y1="172" x2="1140" y2="172" stroke="#00D9FF" stroke-width="0.6" opacity="0.05"/>

  <!-- Terminal label -->
  <text x="86" y="50"
    font-family="'Courier New', Courier, monospace"
    font-size="13"
    fill="#00D9FF"
    opacity="0.55">N0rd-X@github</text>

  <!-- Main text -->
  <text x="86" y="168"
    font-family="'Courier New', Courier, monospace"
    font-size="72"
    font-weight="700"
    fill="#FFFFFF"
    filter="url(#softglow)">N0rd-X</text>

  <!-- Accent line under name (replaces sub-text) -->
  <line x1="86" y1="184" x2="510" y2="184" stroke="#00D9FF" stroke-width="2" opacity="0.55"/>
</svg>
