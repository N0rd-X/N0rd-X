<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#00D9FF" opacity="0.09"/>
    </pattern>
    <radialGradient id="bg" cx="38%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0F1338"/>
      <stop offset="100%" stop-color="#0A0E27"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="900" height="220" fill="#0A0E27"/>
  <rect width="900" height="220" fill="url(#bg)" opacity="0.85"/>
  <rect width="900" height="220" fill="url(#dots)"/>

  <line x1="52" y1="32" x2="52" y2="200" stroke="#00D9FF" stroke-width="1.5" opacity="0.45"/>

  <circle cx="52" cy="32" r="3" fill="#00D9FF" filter="url(#glow)"/>
  <circle cx="52" cy="116" r="5.5" fill="#00D9FF" filter="url(#glow)"/>
  <circle cx="52" cy="200" r="3" fill="#00D9FF" filter="url(#glow)"/>

  <line x1="52" y1="32" x2="520" y2="32" stroke="#00D9FF" stroke-width="0.8" opacity="0.18"/>
  <line x1="820" y1="32" x2="848" y2="32" stroke="#00D9FF" stroke-width="0.8" opacity="0.18"/>
  <line x1="848" y1="32" x2="848" y2="68" stroke="#00D9FF" stroke-width="0.8" opacity="0.18"/>

  <line x1="52" y1="200" x2="848" y2="200" stroke="#00D9FF" stroke-width="0.8" opacity="0.18"/>

  <line x1="780" y1="100" x2="848" y2="100" stroke="#00D9FF" stroke-width="0.6" opacity="0.12"/>
  <line x1="800" y1="116" x2="848" y2="116" stroke="#00D9FF" stroke-width="0.6" opacity="0.09"/>
  <line x1="815" y1="132" x2="848" y2="132" stroke="#00D9FF" stroke-width="0.6" opacity="0.06"/>

  <text x="74" y="76"
    font-family="'Courier New', Courier, monospace"
    font-size="12.5"
    fill="#00D9FF"
    opacity="0.55">N0rd-X@github</text>

  <text x="74" y="138"
    font-family="'Courier New', Courier, monospace"
    font-size="54"
    font-weight="700"
    fill="#FFFFFF"
    filter="url(#softglow)">Nord-X</text>

  <text x="76" y="167"
    font-family="'Courier New', Courier, monospace"
    font-size="14"
    fill="#00D9FF"
    opacity="0.88">Good enough is just a starting point.</text>

  <text x="76" y="190"
    font-family="'Courier New', Courier, monospace"
    font-size="10"
    fill="#FFFFFF"
    opacity="0.26"
    letter-spacing="0.8">HARDWARE  ▸  SOFTWARE  ▸  INTERFACE</text>
</svg>
