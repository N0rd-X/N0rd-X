<svg width="760" height="260" viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.7" fill="#00D9FF" opacity="0.07"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="760" height="260" rx="6" fill="#0A0E27"/>
  <rect width="760" height="260" rx="6" fill="url(#dots)"/>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="759" height="259" rx="6"
    fill="none" stroke="#00D9FF" stroke-width="1" opacity="0.15"/>

  <!-- Title bar -->
  <rect width="760" height="44" rx="6" fill="#0F1338"/>

  <text x="28" y="27"
    font-family="Courier New, monospace"
    font-size="12"
    fill="#00D9FF"
    opacity="0.7">Layers</text>

  <text x="732" y="27"
    font-family="Courier New, monospace"
    font-size="12"
    fill="#FFFFFF"
    opacity="0.25"
    text-anchor="end">Nord-X</text>

  <!-- ── ROW 1: HARDWARE ── -->
  <!-- Layer label -->
  <text x="28" y="82"
    font-family="'Courier New', Courier, monospace"
    font-size="11.5"
    font-weight="700"
    fill="#00D9FF"
    opacity="0.85"
    letter-spacing="1.5">HARDWARE</text>
  <!-- Arrow -->
  <text x="208" y="82"
    font-family="'Courier New', Courier, monospace"
    font-size="12"
    fill="#00D9FF"
    opacity="0.35">──▸</text>
  <!-- Project -->
  <text x="260" y="82"
    font-family="'Courier New', Courier, monospace"
    font-size="14"
    fill="#FFFFFF">Alternative Laptop</text>

  <!-- ── ROW 2: OS ── -->
  <text x="28" y="142"
    font-family="'Courier New', Courier, monospace"
    font-size="11.5"
    font-weight="700"
    fill="#00D9FF"
    opacity="0.85"
    letter-spacing="1.5">SOFTWARE</text>
  <text x="208" y="142"
    font-family="'Courier New', Courier, monospace"
    font-size="12"
    fill="#00D9FF"
    opacity="0.35">──▸</text>
  <text x="260" y="142"
    font-family="'Courier New', Courier, monospace"
    font-size="14"
    fill="#FFFFFF">Custom ROM</text>

  <!-- ── ROW 3: INTERFACE ── -->
  <text x="28" y="202"
    font-family="'Courier New', Courier, monospace"
    font-size="11.5"
    font-weight="700"
    fill="#00D9FF"
    opacity="0.85"
    letter-spacing="1.5">INTERFACE</text>
  <text x="208" y="202"
    font-family="'Courier New', Courier, monospace"
    font-size="12"
    fill="#00D9FF"
    opacity="0.35">──▸</text>
  <text x="260" y="202"
    font-family="'Courier New', Courier, monospace"
    font-size="14"
    fill="#FFFFFF">ROM UI/UX</text>
</svg>